<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>フドキ ― 日本語テキスト解析ツール</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA 配置 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fudoki">
  <link rel="apple-touch-icon" href="static/logo.png">

  <!-- 主题颜色（深浅双主题，与设计系统一致） -->
  <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
  <meta name="msapplication-TileColor" content="#08090a">

  <link rel="stylesheet" href="static/styles.css">
  <!-- 移动端样式：仅在移动设备加载，优先级高于主样式 -->
  <link rel="stylesheet" href="static/mobile.css" media="(max-width: 768px)">
  <link rel="icon" type="image/png" href="static/logo.png">
  <!-- EasyMDE Markdown 编辑器 -->
  <link rel="stylesheet" href="static/libs/easymde/easymde.min.css">
  <!-- Font Awesome 4.7（本地）：EasyMDE 工具栏图标字体。
       之前由 easymde.min.js patch 运行时注入，离线（PWA 断网）时不可用导致图标塌陷；改为静态预载 -->
  <link rel="stylesheet" href="static/libs/font-awesome/css/font-awesome.min.css">

  <!-- 清除缓存脚本 - 必须在其他脚本之前执行（纯本地：清缓存后回到首页，不涉及任何账号） -->
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const shouldClear = urlParams.get('clear');

      if (shouldClear === '1' || shouldClear === 'true') {
        // 保留文档数据（新旧两套命名，兼容迁移前后的版本）
        const keysToPreserve = [
          'texts', 'activeId',
          'fudoki:texts', 'fudoki:activeId'
        ];
        Object.keys(localStorage).forEach(key => {
          if (!keysToPreserve.includes(key)) localStorage.removeItem(key);
        });
        sessionStorage.clear();

        const finish = () => { window.location.replace('./'); };

        if ('caches' in window) {
          caches.keys()
            .then(names => Promise.all(names.map(n => caches.delete(n))))
            .catch(() => {})
            .then(() => {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                  Promise.all(regs.map(r => r.unregister())).catch(() => {}).then(finish);
                }).catch(finish);
              } else {
                finish();
              }
            });
        } else {
          finish();
        }
      }
    })();
  </script>
</head>
<body>

  <!-- PWA 离线资源包进度提示 -->
  <div id="pwaInstallToast" class="pwa-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div class="pwa-toast__icon" id="pwaInstallIcon" aria-hidden="true"></div>
    <div class="pwa-toast__content">
      <div class="pwa-toast__title" id="pwaInstallTitle">离线资源包</div>
      <div class="pwa-toast__message" id="pwaInstallMessage">正在准备离线资源…</div>
      <div class="pwa-toast__progress" id="pwaInstallProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="pwa-toast__progress-bar" id="pwaInstallProgressBar"></div>
      </div>
    </div>
    <button class="pwa-toast__close" id="pwaToastClose" type="button" aria-label="关闭提示">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- 应用壳：左侧文档栏 + 主区 -->
  <div class="app" id="app">

    <!-- 文档栏（桌面常驻；移动端为抽屉） -->
    <aside class="docbar" id="docbar" aria-label="ドキュメント一覧">
      <div class="docbar-head">
        <a class="docbar-brand" href="#" aria-label="Fudoki">
          <svg class="docbar-brand-mark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor" opacity=".9"/>
            <rect x="13" y="3" width="8" height="5" rx="2" fill="currentColor" opacity=".55"/>
            <rect x="13" y="10" width="8" height="11" rx="2" fill="currentColor" opacity=".75"/>
            <rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" opacity=".35"/>
          </svg>
          <span class="docbar-brand-name">Fudoki</span>
        </a>
        <div class="docbar-search">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
          <input type="search" id="docSearchInput" placeholder="ドキュメントを検索…" autocomplete="off" aria-label="ドキュメントを検索">
        </div>
      </div>

      <div class="docbar-list-wrap">
        <div class="docbar-list-head">
          <span class="docbar-list-title" data-i18n="docListTitle">ドキュメント</span>
          <button type="button" class="icon-btn icon-btn-sm" id="docSortToggle" aria-label="作成順を切り替え" title="並び替え：新→旧">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path class="arrow-up" d="M12 6l-4 4.2h8z" fill="currentColor"/>
              <path class="arrow-down" d="M12 18l4-4.2H8z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="docbar-filters" id="docbarFilters" role="group" aria-label="フィルタ"></div>
        <nav class="docbar-list" id="documentList" aria-label="ドキュメントリスト">
          <!-- 文档列表由 JS 生成 -->
        </nav>
      </div>

      <div class="docbar-foot">
        <button type="button" class="btn btn-primary btn-block" id="newDocBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
          <span data-i18n="newDoc">新規ドキュメント</span>
        </button>
      </div>
    </aside>
    <div class="docbar-backdrop" id="docbarBackdrop" hidden></div>

    <!-- 主区 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn" id="docbarToggle" aria-label="ドキュメント一覧を開く" title="ドキュメント一覧">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          </button>
          <span class="topbar-doc-title" id="topbarDocTitle"></span>
        </div>

        <!-- 编辑 ⇄ 分析 分段控件 -->
        <div class="mode-seg" id="modeSegmented" role="tablist" aria-label="モード切替">
          <button type="button" class="mode-seg-btn active" id="modeEditBtn" role="tab" aria-selected="true" data-mode="edit">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14.5 5.5l4 4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/></svg>
            <span data-i18n="modeEdit">編集</span>
          </button>
          <button type="button" class="mode-seg-btn" id="modeAnalyzeBtn" role="tab" aria-selected="false" data-mode="analyze">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-6 3 4 4-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span data-i18n="modeAnalyze">分析</span>
          </button>
        </div>

        <div class="topbar-right">
          <span class="topbar-meta-item" id="editorDocDate" title="最終更新"></span>
          <span class="topbar-meta-item mono" id="editorCharCount" title="文字数">0 字</span>
          <button type="button" class="icon-btn" id="editorStarToggle" aria-pressed="false" title="お気に入り">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path class="star-outline" d="M12 4.6l2.2 4.6 5 .7-3.6 3.5.85 5L12 16l-4.45 2.4.85-5L4.8 9.9l5-.7L12 4.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="star-fill" d="M12 4.6l2.2 4.6 5 .7-3.6 3.5.85 5L12 16l-4.45 2.4.85-5L4.8 9.9l5-.7L12 4.6z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="icon-btn" id="editorDeleteBtn" aria-label="ドキュメントを削除" title="削除">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 4h6l1 2h4v2H4V6h4l1-2zM6 9.5h12l-.8 10.1a1.6 1.6 0 0 1-1.6 1.4H8.4a1.6 1.6 0 0 1-1.6-1.4L6 9.5zm3.4 2.2v7.1h1.2v-7.1H9.4zm3.8 0v7.1h1.2v-7.1h-1.2z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="テーマを切り替え" title="テーマ切替">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path class="icon-moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/>
              <path class="icon-sun" d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-12.6-.8-2h1.6l-.8 2zM12 21.6l-.8-2h1.6l-.8 2zM4.4 12l-2-.8v1.6l2-.8zm19.2 0-2-.8v1.6l2-.8zM6 6.9 4.6 5.4l1.1-1.1L7.1 5.8 6 6.9zm12 12.1-1.4-1.5 1.1-1.1 1.5 1.5-1.2 1.1zM18 6.9l1.4-1.5-1.1-1.1-1.5 1.5L18 6.9zM6 19l-1.4 1.5 1.1 1.1L7.1 20 6 19z" fill="currentColor"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="settingsButton" aria-label="設定" title="設定">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 8.6A3.4 3.4 0 1 0 12 15.4 3.4 3.4 0 0 0 12 8.6zm8.3 4.9-.1-.6 1.6-1.4-1.6-2.8-2 .7-.5-.3-.3-2.1h-3.2l-.3 2.1-.5.3-2-.7-1.6 2.8 1.6 1.4-.1.6.1.6-1.6 1.4 1.6 2.8 2-.7.5.3.3 2.1h3.2l.3-2.1.5-.3 2 .7 1.6-2.8-1.6-1.4.1-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="work" id="work">

        <!-- 编辑面板 -->
        <section class="editor-pane" id="editorPane" data-pane="edit">
          <div class="editor-scroll">
            <div class="input-group">
              <textarea id="textInput" placeholder="日本語テキストを入力…"></textarea>
            </div>
          </div>
          <div class="editor-foot">
            <div class="fd-select" id="editorInputFontSelect" data-fd-select></div>
            <div class="fd-select" id="editorContentFontSelect" data-fd-select></div>
            <div class="font-scale">
              <input type="range" id="editorFontSizeRange" min="0.8" max="1.5" step="0.05" value="1" aria-label="文字サイズ">
              <span class="mono" id="editorFontSizeValue">100%</span>
            </div>
          </div>
        </section>

        <!-- 分析面板 -->
        <section class="analysis-pane" id="analysisPane" data-pane="analyze" hidden>
          <!-- TTS 迷你控制条 -->
          <div class="tts-bar" id="ttsBar" role="group" aria-label="読み上げコントロール">
            <button type="button" class="icon-btn tts-play" id="headerPlayToggle" aria-label="全文を読み上げる" title="再生">
              <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
              <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </button>
            <button type="button" class="icon-btn tts-pause" id="headerPauseToggle" aria-label="一時停止" title="一時停止／再開">
              <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor"/></svg>
              <svg class="icon-resume" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </button>
            <div class="tts-progress" id="headerPlayProgress" role="progressbar" aria-label="再生進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="tts-progress-fill" id="headerPlayProgressFill"></div>
            </div>
            <div class="fd-select fd-select-compact" id="headerVoiceSelect" data-fd-select></div>
            <div class="tts-speed">
              <input type="range" id="headerSpeedRange" min="0.5" max="2" step="0.1" value="1" aria-label="話速">
              <span class="mono" id="headerSpeedValue">1.0x</span>
            </div>
            <input type="range" id="headerVolume" class="tts-volume" min="0" max="1" step="0.05" value="1" aria-label="音量" title="音量">
          </div>

          <div class="content-scroll-area" id="content">
            <div class="empty-state">
              <p id="emptyText">エディタでテキストを入力すると、ここに解析結果が表示されます。</p>
            </div>
          </div>
        </section>
      </div>

      <!-- 移动端底部操作坞 -->
      <nav class="dock" id="mobileDock" aria-label="クイック操作">
        <button type="button" class="dock-btn" id="dockNewBtn" aria-label="新規ドキュメント">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="dock-btn" id="dockModeBtn" aria-label="編集／分析を切り替え">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="dock-icon-edit" d="M4 20h4L19 9l-4-4L4 16v4zM14.5 5.5l4 4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/><path class="dock-icon-analyze" d="M4 19V5M4 19h16M8 15l3-6 3 4 4-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button type="button" class="dock-btn dock-play" id="dockPlayBtn" aria-label="読み上げ">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <!-- 阅读模式切换 -->
  <button type="button" class="reading-mode-toggle" id="readingModeToggle" aria-pressed="false" title="読み上げフォロー">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 5.5c2.5-1.5 5.5-1.5 8 0v13c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0v-13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>

  <!-- 设置弹窗（自绘 dialog，内容运行时注入） -->
  <div class="settings-modal" id="settingsModal" role="dialog" aria-modal="true" aria-label="設定">
    <div class="settings-modal-content">
      <div class="settings-modal-header">
        <span class="settings-modal-title" id="settingsModalTitle" data-i18n="settingsTitle">設定</span>
        <button type="button" class="icon-btn" id="settingsModalClose" aria-label="閉じる" title="閉じる">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-content" id="settingsModalBody"></div>
      <input type="file" id="importJsonFile" accept="application/json" hidden>
    </div>
  </div>

  <!-- 通用提示（复用原 ID：示例复制等轻量通知） -->
  <div class="info-toast" id="syncProgressToast" role="status" aria-live="polite">
    <span class="info-toast-text" id="syncProgressText"></span>
  </div>

  <!-- 错误提示 -->
  <div class="error-toast" id="errorToast" role="alert">
    <div class="error-toast-content">
      <svg class="error-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/>
      </svg>
      <div class="error-text" id="errorText">エラーが発生しました</div>
    </div>
  </div>

  <!-- JavaScript（纯本地：无任何 SDK / 远端模块） -->
  <script src="static/libs/easymde/easymde.min.js"></script>
  <script src="static/libs/kuromoji.js"></script>
  <script src="static/libs/kuroshiro.min.js"></script>
  <script src="static/libs/kuroshiro-analyzer-kuromoji.min.js"></script>
  <script src="static/libs/dict/dictionary-service.js"></script>
  <script src="static/segmenter.js"></script>
  <script src="static/js/dictionary.js"></script>
  <script src="static/js/ui-utils.js"></script>
  <script src="static/js/tts.js"></script>
  <script src="static/js/i18n.js"></script>
  <script src="static/main-js.js"></script>
  <script src="static/js/mobile-ux.js"></script>
</body>
</html>
